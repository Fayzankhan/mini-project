services:
  - type: web
    name: pneumonia-detection-app
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && ls -lh saved_model/
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180 app:app
    envVars:
      - key: RENDER
        value: "true"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health
